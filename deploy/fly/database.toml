app = "myselfmd-cloud-cody-db"
primary_region = "cdg"
[build]
  image = "postgres:17-bookworm"
[env]
  POSTGRES_DB = "keycloak"
  POSTGRES_USER = "keycloak"
  PGDATA = "/var/lib/postgresql/data/pgdata"
[[mounts]]
  source = "identity_data"
  destination = "/var/lib/postgresql/data"
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
