app = "qr-connect-cloud-cody"
primary_region = "cdg"
[build]
  dockerfile = "../../Dockerfile"
[env]
  HOST = "::"
  PORT = "3000"
  DATA_DIR = "/data"
  PUBLIC_URL = "https://qr-connect-cloud-cody.fly.dev"
  OAUTH_ISSUER = "https://qr-connect-cloud-cody.fly.dev/auth/realms/qr-connect"
  AUTH_PROXY = "1"
  KEYCLOAK_INTERNAL_HOST = "qr-connect-cloud-cody-auth.internal"
  IOS_APP_ID = "67KC823C9A.com.myself.md"
[[mounts]]
  source = "cloud_data"
  destination = "/data"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
