name: Publish blog
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/publish-blog.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myself-md-production-blog
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'CodyBontecou/myself.md-vault' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out website main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: CodyBontecou/myself.md
          ref: main
          path: site
          persist-credentials: false
      - name: Check out latest vault with publication history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: site/.local/blog-vault
          fetch-depth: 0
          persist-credentials: false
      - name: Require published blog source
        run: |
          if [ ! -f scripts/build-blog.js ] || [ ! -f server/blog.js ] || [ ! -L content/blog ]; then
            echo 'Publish the blog implementation to CodyBontecou/myself.md main before deploying vault updates.' >&2
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build website from vault notes
        run: npm run dashboard:build
      - name: Validate generated content and application
        run: |
          npm run check
          npm run verify:blog
      - name: Validate Worker deployment bundle
        run: npx --no-install wrangler deploy --dry-run --outdir .local/blog-worker
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e4265f322e6380ee832b83ad45e3e8c0
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Add CLOUDFLARE_API_TOKEN to the vault repository Actions secrets.' >&2
            exit 1
          fi
          npx --no-install wrangler deploy --keep-vars
      - name: Verify published content
        run: npm run blog:verify-live
      - name: Record deployed source revisions
        run: |
          site_revision=$(git rev-parse HEAD)
          vault_revision=$(git -C .local/blog-vault rev-parse HEAD)
          printf '### Blog published\n\n- Website: `%s`\n- Vault: `%s`\n- Verified: https://myself.md/blog\n' "$site_revision" "$vault_revision" >> "$GITHUB_STEP_SUMMARY"
