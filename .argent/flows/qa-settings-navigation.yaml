steps:
  - launch:
      ios: com.myself.md
      android: com.codybontecou.sharedjsapp
  - await:
      visible:
        id: qa-open
  - await:
      idle: true
  - run: qa-reset-populated.yaml
  - tap:
      text: Settings
  - await:
      visible:
        id: settings-qa
  - await:
      idle: true
  - scroll-to:
      target:
        id: settings-agent-connection
  - tap:
      id: settings-agent-connection
  - await:
      visible:
        id: pair-link-input
  - await:
      idle: true
  - tap:
      id: pair-camera-permission
  - await:
      visible:
        text: Camera access requires a normal build for integration QA.
  - await:
      idle: true
  - when:
      platform: ios
    steps:
      - tap:
          id: chevron.backward
  - when:
      platform: android
    steps:
      - tap:
          text: Navigate up
  - await:
      visible:
        id: settings-agent-connection
  - await:
      idle: true
  - run: qa-reset-populated.yaml
