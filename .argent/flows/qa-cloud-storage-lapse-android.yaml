steps:
  - echo: Launch fixture app and reset cloud-lapse through QA UI. Synthetic data only.
  - launch: com.myself.md
  - await:
      visible:
        id: qa-open
      timeout: 45000
  - await:
      idle: true
  - tap:
      id: qa-open
  - await:
      visible:
        id: qa-screen
  - await:
      idle: true
  - scroll-to:
      target:
        id: qa-reset-cloud-lapse
  - await:
      visible:
        id: qa-reset-cloud-lapse
  - tap:
      id: qa-reset-cloud-lapse
  - await:
      visible:
        id: profile-row-qa-profile
  - await:
      idle: true
  - await:
      text:
        in:
          id: qa-active
        contains: cloud-lapse
  - echo: Named baseline cloud-lapse reset. Open cloud storage plans.
  - tap:
      id: qa-open
  - await:
      visible:
        id: qa-screen
  - await:
      idle: true
  - await:
      visible:
        id: qa-open-cloud-storage
  - tap:
      id: qa-open-cloud-storage
  - await:
      visible:
        id: cloud-plans-screen
  - await:
      idle: true
  - await:
      text:
        in:
          text: At least 150 MB of cloud exports will be deleted on
        contains: (UTC)
  - await:
      text:
        in:
          text: Paid cloud storage ended and your exports use 250 MB
        contains: '23 days left:'
  - await:
      text:
        in:
          text: Paid cloud storage ended and your exports use 250 MB
        contains: your oldest whole exports are deleted until usage is 100 MB or less.
  - await:
      text:
        in:
          text: Paid cloud storage ended and your exports use 250 MB
        contains: downloading alone does not prevent cloud deletion.
  - await:
      visible:
        text: 250.0 MB of 100 MB used
  - echo: Restore cloud-included fixture baseline through recorded UI; no normal data changes.
  - tap:
      id: qa-open
  - await:
      visible:
        id: qa-screen
  - await:
      idle: true
  - scroll-to:
      target:
        id: qa-reset-cloud-included
  - await:
      visible:
        id: qa-reset-cloud-included
  - tap:
      id: qa-reset-cloud-included
  - await:
      visible:
        id: profile-row-qa-profile
  - await:
      idle: true
  - await:
      text:
        in:
          id: qa-active
        contains: cloud-included
