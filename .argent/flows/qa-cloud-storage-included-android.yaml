steps:
  - echo: Launch fixture app and reset cloud-included through QA UI. Synthetic data only.
  - launch: com.myself.md
  - await:
      visible:
        id: qa-open
      timeout: 45000
  - await:
      idle: true
  - tap:
      id: qa-open
  - await:
      visible:
        id: qa-screen
  - await:
      idle: true
  - scroll-to:
      target:
        id: qa-reset-cloud-included
  - await:
      visible:
        id: qa-reset-cloud-included
  - tap:
      id: qa-reset-cloud-included
  - await:
      visible:
        id: profile-row-qa-profile
  - await:
      idle: true
  - await:
      text:
        in:
          id: qa-active
        contains: cloud-included
  - echo: Named baseline cloud-included reset. Open cloud storage plans.
  - tap:
      id: qa-open
  - await:
      visible:
        id: qa-screen
  - await:
      idle: true
  - await:
      visible:
        id: qa-open-cloud-storage
  - tap:
      id: qa-open-cloud-storage
  - await:
      visible:
        id: cloud-plans-screen
  - await:
      idle: true
  - await:
      visible:
        text: 42.0 MB of 100 MB used
  - await:
      visible:
        id: cloud-plan-period-monthly
  - await:
      text:
        in:
          id: cloud-plan-cloud_10gb
        contains: $2.99 per month
  - await:
      text:
        in:
          id: cloud-plan-cloud_1tb
        contains: $24.99 per month
  - echo: Switch yearly and verify both catalog prices; select 1TB then10GB.
  - tap:
      id: cloud-plan-period-yearly
  - await:
      text:
        in:
          id: cloud-plan-cloud_10gb
        contains: $29.99 per year
  - await:
      text:
        in:
          id: cloud-plan-cloud_1tb
        contains: $249.99 per year
  - tap:
      id: cloud-plan-cloud_1tb
  - scroll-to:
      target:
        id: cloud-plan-subscribe
  - await:
      text:
        in:
          id: cloud-plan-subscribe
        equals: Subscribe to 1 TB · $249.99/year
  - tap:
      id: cloud-plan-cloud_10gb
  - await:
      text:
        in:
          id: cloud-plan-subscribe
        equals: Subscribe to 10 GB · $29.99/year
  - echo: cloud-plan-subscribe fixture handoff reports no charge; dismiss toast before next action.
  - tap:
      id: cloud-plan-subscribe
  - await:
      visible:
        text: Purchases require a normal build for integration QA. Nothing was charged.
  - tap:
      id: action-toast-dismiss
  - await:
      hidden:
        text: Purchases require a normal build for integration QA. Nothing was charged.
  - echo: cloud-plan-restore fixture handoff reports no charge; dismiss toast before next action.
  - tap:
      id: cloud-plan-restore
  - await:
      visible:
        text: Purchases require a normal build for integration QA. Nothing was charged.
  - tap:
      id: action-toast-dismiss
  - await:
      hidden:
        text: Purchases require a normal build for integration QA. Nothing was charged.
  - echo: cloud-plan-manage fixture handoff reports no charge; dismiss toast before next action.
  - tap:
      id: cloud-plan-manage
  - await:
      visible:
        text: Purchases require a normal build for integration QA. Nothing was charged.
  - tap:
      id: action-toast-dismiss
  - await:
      hidden:
        text: Purchases require a normal build for integration QA. Nothing was charged.
  - echo: Inspect full Google Play yearly disclosure and legal URLs.
  - scroll-to:
      target:
        id: cloud-plan-privacy
  - await:
      text:
        in:
          id: cloud-plan-disclosure
        contains: auto-renewing subscription, 1 year, $29.99 per year
  - await:
      text:
        in:
          id: cloud-plan-disclosure
        contains: Cancel anytime in Google Play subscriptions
  - await:
      text:
        in:
          id: cloud-plan-disclosure
        contains: Moving to a smaller plan never deletes files
  - await:
      text:
        in:
          id: cloud-plan-terms
        contains: https://myself.md/terms
  - await:
      text:
        in:
          id: cloud-plan-privacy
        contains: https://myself.md/privacy
  - echo: Restore cloud-included fixture baseline through recorded UI; no normal data changes.
  - tap:
      id: qa-open
  - await:
      visible:
        id: qa-screen
  - await:
      idle: true
  - scroll-to:
      target:
        id: qa-reset-cloud-included
  - await:
      visible:
        id: qa-reset-cloud-included
  - tap:
      id: qa-reset-cloud-included
  - await:
      visible:
        id: profile-row-qa-profile
  - await:
      idle: true
  - await:
      text:
        in:
          id: qa-active
        contains: cloud-included
