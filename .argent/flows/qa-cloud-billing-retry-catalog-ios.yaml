steps:
  - echo: Dedicated iOS fixture baseline through UI; synthetic partition only, nothing charged.
  - launch: com.myself.md
  - await:
      visible:
        id: qa-open
      timeout: 30000
  - await:
      idle: true
  - echo: Activate qa-open; require resulting state.
  - tap:
      id: qa-open
  - await:
      visible:
        id: qa-reset-populated
  - await:
      idle: true
  - echo: Reveal qa-reset-cloud-billing-retry by scrolling; hard state follows.
  - scroll-to:
      target:
        id: qa-reset-cloud-billing-retry
  - echo: Reveal qa-reset-cloud-billing-retry by scrolling; hard state follows.
  - scroll-to:
      target:
        id: qa-reset-cloud-billing-retry
  - echo: Activate qa-reset-cloud-billing-retry; require resulting state.
  - tap:
      id: qa-reset-cloud-billing-retry
  - await:
      visible:
        id: profile-row-qa-profile
  - await:
      idle: true
  - echo: Activate qa-open; require resulting state.
  - tap:
      id: qa-open
  - await:
      visible:
        id: qa-open-cloud-storage
  - await:
      idle: true
  - echo: Activate qa-open-cloud-storage; require resulting state.
  - tap:
      id: qa-open-cloud-storage
  - await:
      visible:
        text: Choose cloud storage
  - await:
      idle: true
  - await:
      text:
        in:
          text: At least 150 MB of cloud exports will be deleted
        equals: At least 150 MB of cloud exports will be deleted on November 13, 2026 (UTC)
  - await:
      text:
        in:
          text: Paid cloud storage ended and your exports use
        equals:
          'Paid cloud storage ended and your exports use 250 MB of the 100 MB included with Lifetime. 28 days
          left: on November 13, 2026 (UTC) your oldest whole exports are deleted until usage is 100 MB or less. Resubscribe,
          or delete enough cloud files before the deadline, to prevent this cleanup. Download files first to keep
          offline copies; downloading alone does not prevent cloud deletion.'
  - await:
      text:
        in:
          text: "Payment problem \xB7 paid storage paused"
        equals: "Payment problem \xB7 paid storage paused"
  - await:
      text:
        in:
          text: App Store is retrying the payment for your 10 GB plan.
        equals:
          App Store is retrying the payment for your 10 GB plan. Until it succeeds your capacity is 100 MB.
          Update your payment method in Manage subscription.
  - echo: Reveal cloud-plans-current by scrolling; verify paused allowance.
  - scroll-to:
      target:
        id: cloud-plans-current
  - await:
      text:
        in:
          text: 250.0 MB of 100 MB used
        equals: "250.0 MB of 100 MB used \xB7 Monthly \xB7 payment problem, paused"
  - echo: Activate BackButton; require resulting state.
  - tap:
      id: chevron.backward
  - await:
      visible:
        id: qa-open-cloud-storage
  - await:
      idle: true
  - echo: Reveal qa-reset-cloud-included by scrolling; hard state follows.
  - scroll-to:
      target:
        id: qa-reset-cloud-included
  - echo: Activate qa-reset-cloud-included; require resulting state.
  - tap:
      id: qa-reset-cloud-included
  - await:
      visible:
        id: profile-row-qa-profile
  - await:
      idle: true
